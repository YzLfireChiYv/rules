# 电脑 Clash 自定义规则（Worker 按 CUSTOM_RULE_URL 内联）
# 路由器 tproxy 看不见进程名；PROCESS-* 只对 PC Clash 生效。
# 域名大组在 Worker / gw-ctrl 内置（docs/RULES.md），这里不要重复。
#
# 匹配从上到下，先中先胜。轻重：
#   1. PROCESS-NAME  — 域名分不全（Teams 会打一堆 microsoft / 遥测域）
#   2. 个人域名
#   3. （其余交给订阅内置）

# --- 1. 进程名（必须最先）---
