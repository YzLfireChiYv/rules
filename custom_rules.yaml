- PROCESS-NAME,Teams.exe,US_Guard
- PROCESS-NAME,ms-teamsupdate.exe,US_Guard
- PROCESS-NAME,ONENOTE.EXE,US_Guard
- PROCESS-NAME,MadokaExedra.exe,Steam

# --- 2. 个人例外（只放内置没有的）---
- DOMAIN-SUFFIX,frp-egg.com,DIRECT
- DOMAIN-SUFFIX,huang1111.cn,DIRECT
